<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام البحث والتحقق — سوريا</title>
    <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔍 نظام البحث والتحقق</h1>
            <p>أدخل الاسم أو الرقم الوطني، أو امسح رمز QR</p>
        </header>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="اكتب الاسم أو الرقم الوطني..." autocomplete="off">
            <button id="qrBtn" class="qr-btn">📷</button>
            <button id="searchBtn">بحث</button>
        </div>

        <!-- ماسح QR -->
        <div class="qr-scanner" id="qrScanner" style="display: none;">
            <div class="scanner-header">
                <h3>📷 مسح رمز QR</h3>
                <button id="closeScanner" class="close-btn">✕</button>
            </div>
            <video id="qrVideo" autoplay playsinline></video>
            <p class="scanner-hint">وجّه الكاميرا نحو الرمز QR</p>
        </div>

        <!-- استيراد ملف CSV -->
        <div class="import-section">
            <label for="csvInput" class="import-btn">📊 استيراد من CSV</label>
            <input type="file" id="csvInput" accept=".csv" style="display: none;">
        </div>

        <div class="results" id="results">
            <div class="empty-state">
                <p>أدخل بيانات البحث أو امسح رمز QR</p>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
